<style>
:root{
  --bg:#e6e8e4;--surface:#f4f5f1;--ink:#1c2321;--muted:#55605a;--line:#c5cac3;--sun:#c9a14a;--coral:#a8452f;--indigo:#1c2321;--link:#7a1f2b;--top-bg:#f4f5f1;--top-ink:#1c2321;--top-line:#c5cac3;--hero-bg:#dfe3dc;--hero-ink:#1c2321;--hero-muted:#46514b;--hero-accent:#7a1f2b;--cta-bg:#1c2321;--cta-ink:#f4f5f1;--cta-hover:#7a1f2b;--cta-hover-ink:#ffffff;--fab-bg:#f4f5f1;--fab-ink:#1c2321;--fab-ring:#7a1f2b;
  --head:"Fraunces",Georgia,"Times New Roman",serif;--body:"Literata",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--surface:#1a211e;--ink:#ece9df;--muted:#9aa39d;--line:#2d3733;--link:#e0a3a9;--top-bg:#1c2321;--top-ink:#ece9df;--top-line:#2d3733;--hero-bg:#1c2321;--hero-ink:#ece9df;--hero-muted:#c9ccc3;--hero-accent:#c9a14a;--cta-bg:#c9a14a;--cta-ink:#1c2321;--cta-hover:#ffffff;--cta-hover-ink:#1c2321;--fab-bg:#1c2321;--fab-ink:#ece9df;--fab-ring:#c9a14a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--surface:#1a211e;--ink:#ece9df;--muted:#9aa39d;--line:#2d3733;--link:#e0a3a9;--top-bg:#1c2321;--top-ink:#ece9df;--top-line:#2d3733;--hero-bg:#1c2321;--hero-ink:#ece9df;--hero-muted:#c9ccc3;--hero-accent:#c9a14a;--cta-bg:#c9a14a;--cta-ink:#1c2321;--cta-hover:#ffffff;--cta-hover-ink:#1c2321;--fab-bg:#1c2321;--fab-ink:#ece9df;--fab-ring:#c9a14a;color-scheme:dark}
html{scroll-padding-top:5rem;scroll-behavior:smooth}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--top-bg);z-index:30}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top-bg);color:var(--top-ink);border-bottom:1px solid var(--top-line);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1.25rem;font-family:var(--head);font-weight:500}
header.top a{text-decoration:none}
.brand{font-weight:800;letter-spacing:-.01em}
.links{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap}
.links a{opacity:.8}.links a:hover{opacity:1;color:var(--hero-accent)}
.tbtn{all:unset;cursor:pointer;opacity:.8;font-size:.9rem}.tbtn:hover{opacity:1;color:var(--sun)}
.hero{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden}
.hero-in{max-width:70rem;margin:0 auto;padding:4.5rem 1.25rem 5rem;display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center}
.years{font-family:var(--head);color:var(--hero-accent);font-weight:500;font-size:1.1rem;margin:0 0 1rem}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(2.6rem,7.5vw,6rem);line-height:.92;letter-spacing:-.02em;margin:0 0 1.5rem}
.hero p.lead{font-size:1.2rem;max-width:30rem;color:var(--hero-muted);margin:0 0 2rem}
.cta{display:inline-block;background:var(--cta-bg);color:var(--cta-ink);font-family:var(--head);font-weight:800;padding:.8rem 1.4rem;border-radius:999px;text-decoration:none}
.cta:hover{background:var(--cta-hover);color:var(--cta-hover-ink)}
.hero svg{width:100%;height:auto;display:block}
section.block{max-width:70rem;margin:0 auto;padding:4rem 1.25rem 1rem}
h2.sec{font-family:var(--head);font-weight:800;font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.02em;line-height:1.1;margin:0 0 .5rem}
.sub{color:var(--muted);margin:0 0 2rem;max-width:36rem}
.tl{display:flex;gap:1rem;overflow-x:auto;padding:.5rem 0 1.5rem;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.ev{flex:0 0 14rem;scroll-snap-align:start;position:relative;padding-top:1.7rem}
.ev::before{content:"";position:absolute;top:0;left:0;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--coral);border:3px solid var(--bg);z-index:1}
.ev::after{content:"";position:absolute;top:.5rem;left:0;right:-1rem;height:3px;background:var(--sun)}
.ev b{font-family:var(--head);font-weight:800;font-size:1.8rem;display:block;line-height:1}
.ev span{font-size:.95rem;color:var(--muted);display:block;margin-top:.4rem;line-height:1.5}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.filters button{all:unset;cursor:pointer;font-family:var(--head);font-weight:500;padding:.4rem 1rem;border:1.5px solid var(--line);border-radius:999px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.5rem}
.card{display:block;text-decoration:none;grid-column:span 3;background:var(--surface);border-radius:1.1rem;overflow:hidden;border:1px solid var(--line);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card.big{grid-column:span 6;display:grid;grid-template-columns:1.1fr 1fr}
.cover{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.card.big .cover{aspect-ratio:16/10;height:auto;min-height:0}
.cb{position:relative;z-index:1;background:var(--surface);padding:1.2rem 1.3rem 1.5rem}
.meta{font-family:var(--head);font-size:.9rem;color:var(--muted)}
.card h3{font-family:var(--head);font-weight:800;font-size:1.3rem;line-height:1.2;letter-spacing:-.01em;margin:.35rem 0 .5rem}
.card.big h3{font-size:clamp(1.6rem,3vw,2.2rem)}
.card p{margin:0;font-size:.98rem;color:var(--muted)}
.read{max-width:44rem;margin:0 auto;padding:2rem 1.25rem 3rem}
.read .cover{border-radius:1.1rem;margin:1rem 0 2rem}
.read h1{font-family:var(--head);font-weight:800;font-size:clamp(2.1rem,5vw,3.2rem);line-height:1.05;letter-spacing:-.025em;margin:.4rem 0 1.5rem}
.read p{margin:0 0 1.3rem}
.back{all:unset;cursor:pointer;font-family:var(--head);font-weight:500;color:var(--link)}.back:hover{text-decoration:underline}
.next{display:block;margin-top:2.5rem;padding:1.2rem 1.4rem;border-radius:1rem;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.next small{font-family:var(--head);color:var(--muted)}
.next b{display:block;font-family:var(--head);font-weight:800;font-size:1.2rem}
footer{max-width:70rem;margin:3rem auto 0;padding:1.5rem 1.25rem 3rem;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
@media (max-width:760px){
  .hero-in{grid-template-columns:1fr;padding:3rem 1.25rem}
  .hero svg{max-width:20rem;margin:0 auto}
  .card,.card.big{grid-column:span 6}.card.big{display:block}
  .card.big .cover{aspect-ratio:16/10;min-height:0}
  .links a.hide{display:none}
}
img,svg{max-width:100%}
.tbtn,.filters button,.back{min-height:2.75rem;display:inline-flex;align-items:center}
@media (min-width:761px) and (max-width:1000px){.card{grid-column:span 3}.card.big{grid-column:span 6}.hero-in{gap:1rem}}
@media (hover:none){.card:hover{transform:none}}
@media (max-width:760px){body{font-size:1rem}header.top{padding:.4rem 1rem}.hero h1{font-size:clamp(2.6rem,14vw,4rem)}.hero-in{padding:2.5rem 1.25rem 3rem}.ev{flex-basis:11.5rem}.tl{margin-right:-1.25rem;padding-right:1.25rem}.read{padding-top:1.25rem}section.block{padding-top:3rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
img.cover{object-position:50% 30%;filter:grayscale(1) contrast(1.05)}
.read img.cover{width:min(100%,30rem);aspect-ratio:auto;height:auto;display:block;margin:1rem auto 2rem}
.portrait{margin:0;width:min(100%,22rem);justify-self:center}
.portrait img{display:block;width:100%;height:auto;border-radius:.35rem;outline:3px solid var(--sun);outline-offset:6px}
.portrait figcaption{color:var(--hero-muted);font-size:.85rem;margin-top:1rem}
.tw{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
.tfab{all:unset;cursor:pointer;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--fab-bg);color:var(--fab-ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--fab-ring),0 6px 18px rgba(0,0,0,.35)}
.tfab:hover{filter:brightness(1.08)}
.tpop{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:1rem;padding:.8rem;min-width:12rem;box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:.4rem}
.tpop[hidden]{display:none}
.tpop p{margin:0 0 .2rem;font-family:var(--head);font-weight:800}
.tpop button{all:unset;cursor:pointer;box-sizing:border-box;min-height:2.75rem;padding:.5rem .9rem;border-radius:.6rem;border:1.5px solid var(--line);font-family:var(--head);font-weight:600;display:flex;align-items:center}
.tpop button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tfab:focus-visible,.tpop button:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.read h2{font-family:var(--head);font-weight:800;font-size:1.45rem;line-height:1.2;letter-spacing:-.01em;margin:2.2rem 0 .6rem}
img.cover.color{filter:none}
@media (max-width:760px){
  header.top{flex-wrap:wrap;gap:.1rem 1rem;padding:.55rem 1rem .35rem}
  .brand{font-size:1.05rem}
  .links{width:100%;flex-wrap:nowrap;overflow-x:auto;gap:1.2rem;font-size:.95rem;white-space:nowrap}
  .links a,.links a.hide{display:inline-flex;align-items:center;min-height:2.5rem}
  html{scroll-padding-top:6.5rem}
}
@media (min-width:761px){.card.big .cover{aspect-ratio:auto;height:100%;min-height:16rem}}
.cover{position:static;max-height:none}
.read p.cap{margin:-1.2rem auto 2rem;text-align:center;font-size:.85rem;color:var(--muted);max-width:30rem}
.src{margin-top:2.4rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.95rem}
.src h2{margin-top:0}
.src ul{padding-left:1.1rem;margin:0}
.src li{margin:.5rem 0}
.src a{color:var(--link);overflow-wrap:anywhere}
.cap a{color:var(--link);overflow-wrap:anywhere}
</style>

   corpo:[{h:"Infância em Franca"},"Abdias nasceu em 14 de março de 1914, em Franca, no interior de São Paulo, numa família pobre, e suas duas avós foram escravizadas nos tempos do Império. Filho de um sapateiro, trabalhou desde criança para ajudar nas despesas da casa e estudou no Grupo Escolar. Desde cedo sentiu o preconceito racial. Também se encantava com as roupas e fantasias das cavalhadas e das festas de Reis, um interesse que reapareceria mais tarde no teatro.",{h:"Da Frente Negra ao Carandiru"},"No início dos anos 1930, depois de servir ao Exército, foi para São Paulo e se aproximou da Frente Negra Brasileira, a primeira organização de alcance nacional dedicada à igualdade racial. Em 1938, ajudou a organizar o Congresso Afro-Campineiro, que debateu a discriminação racial em Campinas.","Entre 1939 e 1941, viajou pela América do Sul com um grupo de poetas, a Santa Hermandad Orquídea. Em Lima, assistiu a O Imperador Jones, de Eugene O’Neill, peça que voltaria a marcar sua vida. De volta ao Brasil, foi preso depois de reagir a um episódio de discriminação racial e passou cerca de dois anos na Penitenciária do Carandiru. Lá, criou com outros presos o Teatro do Sentenciado.",{h:"Muitos ofícios, um mesmo propósito"},"Ao sair da prisão, mudou-se para o Rio de Janeiro e fundou o Teatro Experimental do Negro. Foi também poeta, ensaísta, artista plástico, professor universitário, deputado federal e senador. Morreu em 23 de maio de 2011, aos 97 anos, e suas cinzas foram depositadas na Serra da Barriga, em Alagoas, onde Zumbi dos Palmares liderou a resistência do Quilombo dos Palmares. A Câmara dos Deputados o chamou de precursor do movimento negro no Brasil.","Alguns detalhes variam entre as fontes, como a data exata da prisão, situada entre 1941 e 1943."]},
  {id:"teatro-experimental-do-negro",cat:"Obra",date:"2026-11-09",min:5,img:IMG_TEN,alt:"Cinco atores em cena, em fotografia em preto e branco",
   title:"O Teatro Experimental do Negro: o palco como lugar de reconhecimento",
   resumo:"Em 1944, Abdias fundou uma companhia para colocar artistas negros como protagonistas no teatro brasileiro.",
   corpo:[{h:"Uma ideia nascida de um incômodo"},"O Teatro Experimental do Negro (TEN) foi fundado em 13 de outubro de 1944, no Rio de Janeiro. A ideia ganhou força depois que Abdias assistiu a uma peça em que o papel principal, um personagem negro, era interpretado por um ator branco pintado de preto. O TEN nasceu para mudar isso: inserir o negro no teatro brasileiro como ator, tema, diretor e participante.",{h:"A estreia no Teatro Municipal"},"A companhia estreou em 8 de maio de 1945, no Teatro Municipal do Rio, com O Imperador Jones, de Eugene O’Neill. Foi a primeira vez que um artista negro ocupou ali o papel principal. O grupo reuniu nomes como Ruth de Souza, Milton Gonçalves e Léa Garcia.",{h:"Dramaturgia, educação e imprensa"},"Faltavam peças com personagens negros densos, e o TEN foi atrás delas. Nelson Rodrigues escreveu Anjo Negro para o grupo, e Joaquim Ribeiro escreveu Aruanda. Em 1948, foi encenada Filhos de Santo, de José de Moraes Pinho, e, em 1952, Rapsódia, do próprio Abdias. Sortilégio, também de Abdias, foi encenada em 1957, com ele e Léa Garcia em cena, e foi a última peça da companhia.","O TEN foi além do palco. Ofereceu cursos de alfabetização e cultura para operários e empregadas domésticas e, em 1948, passou a ter o jornal Quilombo, voz das reivindicações do movimento negro. Em 1950, no I Congresso do Negro Brasileiro, defendeu o estudo da herança africana no país. Naquele mesmo ano, Abdias lançou o projeto do Museu de Arte Negra.",{h:"Um legado que se multiplicou"},"O TEN inspirou outros grupos, como o Teatro Experimental do Negro de São Paulo. É considerado a primeira entidade afro-brasileira a relacionar a luta por direitos civis com a recuperação da herança cultural africana."]},
  {id:"exilio-de-treze-anos",cat:"Vida",date:"2026-11-05",min:4,img:IMG_EXILIO,pos:"70% 30%",alt:"Homem de óculos e barba gesticulando, diante de um cartaz com a palavra History em letras vazadas, em fotografia em preto e branco",
   title:"O exílio de treze anos",
   resumo:"Perseguido pela ditadura militar, Abdias viveu nos Estados Unidos e na Nigéria e seguiu produzindo.",
   corpo:[{h:"A viagem sem volta"},"Em 1968, Abdias aceitou um convite para um intercâmbio acadêmico nos Estados Unidos. Ele já era alvo de repressão desde o golpe de 1964, por causa de suas atividades antirracistas e de sua ligação com movimentos de libertação africanos. Com a edição do AI-5, em dezembro daquele ano, que proibiu oficialmente a militância negra antirracista, não pôde mais voltar. O exílio durou cerca de treze anos, entre os Estados Unidos e a Nigéria.",{h:"Ensino e militância no exterior"},"Lecionou em universidades como Yale, Wesleyan, Temple e a Universidade Estadual de Nova York em Buffalo, onde fundou a Cátedra de Culturas Africanas no Novo Mundo e se tornou professor emérito. Na Nigéria, atuou na Universidade de Ifé. Esteve em encontros internacionais do mundo africano, como o Congresso Pan-Africano, e se aproximou do Black Arts Movement, nos Estados Unidos.",{h:"A arte como resistência"},"No exílio, Abdias produziu uma vasta obra de artista plástico, com temas ligados à cultura religiosa afro-brasileira. Uma de suas pinturas, Okê Oxóssi, foi exposta mais tarde no Masp. Foi também nesse período que escreveu O Genocídio do Negro Brasileiro, que contribuiu para criticar a tese da democracia racial.","Só voltou ao Brasil em 1981 e, pouco depois, foi eleito deputado federal."]},
  {id:"genocidio-e-quilombismo",cat:"Obra",date:"2026-11-02",min:4,img:IMG_LIVRO,color:true,pos:"40% 30%",alt:"Homem de barba branca e óculos segurando o livro O Quilombismo diante de um microfone, em um plenário",
   title:"O Genocídio do Negro Brasileiro e o Quilombismo",
   resumo:"Dois livros que questionaram a ideia de democracia racial e propuseram outra leitura do Brasil.",
   corpo:[{h:"Contra o mito da democracia racial"},"Em 1978, Abdias publicou O Genocídio do Negro Brasileiro, pela editora Paz e Terra. O livro reúne seus estudos sobre o racismo no país desde o fim do século XIX e critica a tese da democracia racial, a ideia de que o Brasil seria um lugar sem discriminação entre brancos e negros. Parte da obra foi escrita durante o exílio, e uma edição posterior a reuniu com o livro Sitiado em Lagos, sob o título O Brasil na Mira do Pan-Africanismo.",{h:"O Quilombismo"},"Dois anos depois, em 1980, veio O Quilombismo. Nele, Abdias propõe a experiência dos quilombos, as comunidades formadas por pessoas que resistiram à escravidão, como referência para a organização política e cultural da população negra. Os dois títulos são considerados fundamentais para entender a formação do Brasil.",{h:"Outras obras"},"A bibliografia de Abdias inclui ainda Teatro Experimental do Negro: Testemunhos (1966), O Negro Revoltado (1968), Orixás: os deuses vivos da África (1995) e Africans in Brazil: a Pan-African Perspective, publicado nos anos 1990. Em todos, a pesquisa caminha junto com a militância."]},
  {id:"congresso-e-senado",cat:"Legado",date:"2026-10-29",min:4,img:IMG_SENADO,color:true,pos:"50% 30%",alt:"Homem de cabelo e barba brancos e óculos de armação dourada falando diante de microfones",
   title:"Do Congresso ao Senado: a luta por direitos",
   resumo:"Foi o primeiro parlamentar afro-brasileiro a dedicar seu mandato à pauta antirracista.",
   corpo:[{h:"Deputado federal"},"Abdias ajudou a fundar o PDT, ainda no exílio, e criou em 1982 a Secretaria do Movimento Negro do partido. Eleito deputado federal, exerceu o mandato por quatro anos, a partir de 1983. É apontado como o primeiro parlamentar afro-brasileiro a dedicar o mandato à luta antirracista. Em 1983, apresentou o primeiro projeto de lei que propunha políticas de ação afirmativa no país.",{h:"Governo do Rio e Senado"},"No início dos anos 1990, foi secretário extraordinário de Defesa e Promoção das Populações Afro-Brasileiras, cargo criado no governo do estado do Rio de Janeiro. Suplente de Darcy Ribeiro, assumiu uma cadeira no Senado provisoriamente em 1991 e, de forma definitiva, em 1997, depois da morte do titular, permanecendo até 1999. Depois, foi secretário estadual de Cidadania e Direitos Humanos, entre 1999 e 2000.",{h:"Entidades e reconhecimento"},"Fora do parlamento, é apontado entre os fundadores do Movimento Negro Unificado, em 1978, e criou, com Elisa Larkin Nascimento, o Instituto de Pesquisas e Estudos Afro-Brasileiros (Ipeafro), em 1981, que preserva seu acervo. Em 2010, foi indicado ao Prêmio Nobel da Paz."]}
];

  S:["Senado Federal (Arquivo S): Senador Abdias Nascimento, uma vida dedicada à luta contra o racismo","https://www12.senado.leg.br/noticias/especiais/arquivo-s/senador-abdias-nascimento-uma-vida-dedicada-a-luta-contra-o-racismo"],
  C:["Câmara dos Deputados: Morre o ex-deputado Abdias Nascimento, precursor do movimento negro","https://www.camara.leg.br/noticias/215165-morre-o-ex-deputado-abdias-nascimento-precursor-do-movimento-negro/"],
  I:["Itatiaia: Conheça Abdias Nascimento, um dos pioneiros do movimento antirracista brasileiro","https://www.itatiaia.com.br/brasil/conheca-abdias-nascimento-um-dos-pioneiros-do-movimento-antirracista-brasileiro/"],

  "de-franca-ao-rio":{cap:"Retrato de Abdias Nascimento.",credit:"Ipeafro",imgSrc:["Museu de Arte Negra (Ipeafro)","https://man.ipeafro.org.br/colecoes"],fontes:[SRC.S,SRC.C,SRC.I,SRC.U]},

  "congresso-e-senado":{cap:"Em pronunciamento.",credit:"J. Freitas/Agência Senado",fontes:[SRC.S,SRC.C,SRC.P]}
};
POSTS.forEach(function(p){ var x = EXTRA[p.id]; if(x){ p.cap = x.cap; p.fontes = x.fontes; p.imgSrc = x.imgSrc; if(x.credit){ p.credit = x.credit; } } });
var EVENTS = [
  ["1914","Nasce em Franca (SP), em 14 de março."],

  ["1945","O TEN estreia no Teatro Municipal com O Imperador Jones."],

  ["1997","Assume como senador, suplente de Darcy Ribeiro."],

];
var COLORS = {"Vida":["#7a1f2b","#c9a14a","#a8452f"],"Obra":["#a8452f","#1c2321","#c9a14a"],"Legado":["#3f6b5a","#1c2321","#c9a14a"]};
var cats = ["Todos","Vida","Obra","Legado"], current = "Todos";
var app = document.getElementById("app");

function art(cat, idx){
  var c = COLORS[cat] || COLORS.Vida, s = "";
  if(cat === "Obra"){
    for(var i=0;i<8;i++) s += '<rect x="'+(i*50)+'" y="0" width="50" height="250" fill="'+(i%2?c[1]:c[0])+'"/>';
    s += '<circle cx="200" cy="250" r="'+(90+idx*8)+'" fill="'+c[2]+'"/>';
  } else if(cat === "Legado"){
    s += '<rect width="400" height="250" fill="'+c[0]+'"/>';
    for(var j=0;j<5;j++) s += '<rect x="'+(40+j*66)+'" y="'+(210-j*34-idx*4)+'" width="52" height="'+(60+j*34+idx*4)+'" fill="'+(j%2?c[2]:c[1])+'"/>';
  } else {
    s += '<rect width="400" height="250" fill="'+c[0]+'"/>';
    for(var k=5;k>0;k--) s += '<circle cx="'+(150+idx*20)+'" cy="125" r="'+(k*24)+'" fill="'+(k%2?c[1]:c[2])+'"/>';
  }
  return '<svg class="cover" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração da categoria '+cat+'">'+s+'</svg>';
}
function cover(p, i){ return p.img ? '<img class="cover'+(p.color?' color':'')+'" src="'+p.img+'" alt="'+(p.alt||p.title)+'" style="object-position:'+(p.pos||'50% 30%')+'">' : art(p.cat, i); }
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmt(d){var q=d.split("-"),m=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];return parseInt(q[2],10)+" "+m[parseInt(q[1],10)-1]+" "+q[0]}

function hero(){
  return '<div class="hero" id="inicio"><div class="hero-in"><div><p class="years">1914 a 2011</p><h1>Abdias<br>Nascimento</h1><p class="lead">Ator, dramaturgo, artista plástico, professor, deputado e senador. A vida e o legado de um dos nomes centrais da luta antirracista no Brasil.</p><a class="cta" href="#textos">Ler os textos</a></div>'+
  '<figure class="portrait"><img src="'+IMG_ABDIAS+'" width="425" height="640" alt="Retrato de Abdias Nascimento em 2004, de barba branca e óculos, segurando uma bengala esculpida" fetchpriority="high" decoding="async"><figcaption>Abdias Nascimento, 2004. Foto: Marcelo Faustini.</figcaption></figure></div></div>';
}
function timeline(){
  return '<section class="block" id="linha-do-tempo"><h2 class="sec">Linha do tempo</h2><p class="sub">Marcos de uma trajetória de mais de nove décadas.</p><div class="tl" tabindex="0" aria-label="Linha do tempo, role para o lado">'+
  EVENTS.map(function(e){return '<div class="ev"><b>'+e[0]+'</b><span>'+e[1]+'</span></div>'}).join("")+'</div></section>';
}
function list(){
  var items = POSTS.filter(function(p){return current==="Todos"||p.cat===current});
  var cards = items.map(function(p,i){
    var idx = POSTS.indexOf(p);
    return '<a class="card'+(i===0?' big':'')+'" href="#'+p.id+'">'+cover(p,idx)+'<div class="cb"><div class="meta">'+p.cat+', '+p.min+' min de leitura</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.resumo)+'</p></div></a>';
  }).join("");
  var f = cats.map(function(c){return '<button type="button" data-c="'+c+'" aria-pressed="'+(c===current)+'">'+c+'</button>'}).join("");
  return '<section class="block" id="textos"><h2 class="sec">Textos</h2><p class="sub">Vida, obra e legado, em leituras curtas.</p><div class="filters">'+f+'</div><div class="grid">'+cards+'</div></section>';
}
function post(p){
  var idx = POSTS.indexOf(p), n = POSTS[(idx+1)%POSTS.length];
  var body = p.corpo.map(function(x){return typeof x === "string" ? '<p>'+esc(x)+'</p>' : '<h2>'+esc(x.h)+'</h2>'}).join("");
  var cap = p.cap ? '<p class="cap">'+esc(p.cap)+(p.credit ? ' Foto: '+esc(p.credit)+'.' : '')+'</p>' : '';
  var src = (p.fontes && p.fontes.length) ? '<aside class="src"><h2>Fontes</h2><ul>'+p.fontes.map(function(f){return '<li><a href="'+f[1]+'" target="_blank" rel="noopener noreferrer">'+esc(f[0])+'</a></li>'}).join("")+'</ul></aside>' : '';
  return '<article class="read"><button class="back" type="button" id="back">← Voltar</button>'+cover(p,idx)+cap+'<div class="meta">'+p.cat+', '+fmt(p.date)+', '+p.min+' min de leitura</div><h1>'+esc(p.title)+'</h1>'+body+src+'<a class="next" href="#'+n.id+'"><small>Próximo texto</small><b>'+esc(n.title)+'</b></a></article>';
}
function route(){
  var id = location.hash.replace("#",""), p = POSTS.filter(function(x){return x.id===id})[0];
  if(p){ app.innerHTML = post(p); document.title = p.title+" | Abdias Nascimento"; document.getElementById("back").onclick=function(){location.hash="textos"}; window.scrollTo(0,0); }
  else { document.title = "Abdias Nascimento"; app.innerHTML = hero()+timeline()+list();
    app.querySelectorAll(".filters button").forEach(function(b){b.onclick=function(){current=b.getAttribute("data-c");var y=window.scrollY;route();window.scrollTo(0,y)}});
    if(id==="textos"||id==="linha-do-tempo"){var el=document.getElementById(id); if(el) el.scrollIntoView();} else { window.scrollTo(0,0); }
  }
}
window.addEventListener("hashchange", route);
function updateBar(){
  var r = document.documentElement, t = r.getAttribute("data-theme");
  var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m){ m.setAttribute("content", dark ? "#1c2321" : "#f4f5f1"); }
}
var tfab = document.getElementById("tfab"), tpop = document.getElementById("tpop");
function setTheme(t, save){
  var r = document.documentElement, forced = (t === "light" || t === "dark");
  if(forced){ r.setAttribute("data-theme", t); } else { r.removeAttribute("data-theme"); }
  tpop.querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-t") === (forced ? t : "auto"))); });
  if(save){ try{ localStorage.setItem("tema", t); }catch(e){} }
  updateBar();
}
function togglePop(open){ tpop.hidden = !open; tfab.setAttribute("aria-expanded", String(open)); }
tfab.onclick = function(e){ e.stopPropagation(); togglePop(tpop.hidden); };
tpop.onclick = function(e){ e.stopPropagation(); var b = e.target.closest("button"); if(b){ setTheme(b.getAttribute("data-t"), true); } };
document.addEventListener("click", function(){ togglePop(false); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ togglePop(false); tfab.focus(); } });
var saved = "auto"; try{ saved = localStorage.getItem("tema") || "auto"; }catch(e){}
setTheme(saved, false);
try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateBar); }catch(e){}
route();
</script>
